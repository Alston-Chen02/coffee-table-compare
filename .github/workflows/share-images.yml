name: Publish cream share image
on:
  push:
    paths:
      - .github/workflows/share-images.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write cream preview
        shell: python
        run: |
          import base64
          from pathlib import Path
          Path('share-cream-v2.jpg').write_bytes(base64.b64decode(''))
      - name: Commit asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add share-cream-v2.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Publish cream coffee table share cover"
          git pull --rebase origin main
          git push
