name: Publish share images
on:
  push:
    paths:
      - .github/workflows/share-images.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write PNG assets
        shell: python
        run: |
          import base64
          from pathlib import Path
          Path('share-card.png').write_bytes(base64.b64decode(''))
          Path('apple-touch-icon.png').write_bytes(base64.b64decode(''))
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add share-card.png apple-touch-icon.png
          git diff --cached --quiet && exit 0
          git commit -m "Add coffee table social preview and app icon"
          git pull --rebase origin main
          git push
